 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Fitness Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f0f2f5;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        form {
            background-color: #fff;
            padding: 20px;
            max-width: 500px;
            margin: 20px auto;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }

        table {
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background-color: #007BFF;
            color: white;
        }
    </style>
</head>
<body>

    <h1>Simple Fitness Tracker</h1>

    <form id="fitnessForm">
        <label>Date:</label>
        <input type="date" id="date" required>

        <label>Exercise Type:</label>
        <select id="exercise" required>
            <option value="">-- Select Exercise --</option>
            <option value="Running">Running</option>
            <option value="Cycling">Cycling</option>
            <option value="Swimming">Swimming</option>
            <option value="Walking">Walking</option>
            <option value="Yoga">Yoga</option>
            <option value="Gym Workout">Gym Workout</option>
        </select>

        <label>Duration (minutes):</label>
        <input type="number" id="duration" min="1" required>

        <label>Calories Burned:</label>
        <input type="number" id="calories" min="1" required>

        <button type="submit">Add Entry</button>
    </form>

    <table id="trackerTable">
        <thead>
            <tr>
                <th>Date</th>
                <th>Exercise</th>
                <th>Duration (min)</th>
                <th>Calories</th>
            </tr>
        </thead>
        <tbody>
            <!-- Entries will appear here -->
        </tbody>
    </table>

    <script>
        const form = document.getElementById('fitnessForm');
        const tableBody = document.querySelector('#trackerTable tbody');

        form.addEventListener('submit', function(event) {
            event.preventDefault();

            const date = document.getElementById('date').value;
            const exercise = document.getElementById('exercise').value;
            const duration = document.getElementById('duration').value;
            const calories = document.getElementById('calories').value;

            // Create a new row
            const row = document.createElement('tr');

            row.innerHTML = `
                <td>${date}</td>
                <td>${exercise}</td>
                <td>${duration}</td>
                <td>${calories}</td>
            `;

            tableBody.appendChild(row);

            // Reset the form
            form.reset();
        });
    </script>

</body>
</html>
